name: build-and-smoke

# Builds the manuscript with the venue's template and runs the JS mutation harness
# smoke test. The workflow deliberately mirrors the local build: pdflatex + bibtex
# (never latexmk, which the project does not use) with the same three-pass order.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  paper:
    name: Build manuscript (pdfLaTeX + BibTeX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          # apalike-sol.bst ships in the repo; no extra TeX packages are required
          # beyond a standard scheme.
          latexmk_use_lualatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error

      - name: Verify the reference audit passes
        run: |
          python3 -m pip install --quiet requests || true
          python3 scripts/audit_refs.py

      - name: Verify generated numbers are current
        run: |
          python3 scripts/make_numbers.py
          python3 scripts/make_bib.py
          git diff --exit-code -- paper/numbers.tex paper/refs.bib \
            || (echo "::error::paper/numbers.tex or paper/refs.bib is stale; re-run the generators" && exit 1)

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: main.pdf
          path: paper/main.pdf
          if-no-files-found: error

  smoke-js:
    name: JS mutation harness smoke test (Stryker x Cucumber)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install harness dependencies
        working-directory: pilot/smoke-js
        run: npm install --no-audit --no-fund

      - name: Baseline Cucumber suite must pass
        working-directory: pilot/smoke-js
        run: npx --no-install cucumber-js

      - name: Non-BDD unit tests must pass
        working-directory: pilot/smoke-js
        run: node --test test/unit.test.js

      - name: BDD-mode mutation analysis must run and produce a report
        working-directory: pilot/smoke-js
        run: npx --no-install stryker run stryker.bdd.json

      - name: Assert the NO_COVERAGE control is real
        working-directory: pilot/smoke-js
        run: |
          test -f reports/mutation.bdd.json || (echo "::error::no mutation report produced" && exit 1)
          python3 - <<'PY'
          import json, sys
          d = json.load(open("reports/mutation.bdd.json"))
          counts = {}
          for f in d.get("files", {}).values():
              for m in f.get("mutants", []):
                  counts[m.get("status")] = counts.get(m.get("status"), 0) + 1
          total = sum(counts.values())
          print("mutant status counts:", counts, "total:", total)
          # A fixed mutant count is brittle; what must hold is the control that the first
          # submission lacked: an unexercised domain module must produce uncovered mutants,
          # otherwise the harness cannot be shown to separate executed from never-executed.
          if total < 43:
              sys.exit(f"::error::expected at least 43 mutants, got {total} - toolchain drift?")
          if counts.get("NoCoverage", 0) <= 0:
              sys.exit("::error::NO_COVERAGE control failed: expected uncovered mutants from "
                       "the deliberately unexercised domain module")
          if counts.get("Killed", 0) <= 0:
              sys.exit("::error::no mutants killed; the BDD suite is not driving the analysis")
          PY

  metric-tests:
    name: Differential-kill metric regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the differential-kill unit tests
        # These exist because the first submission shipped an inverted headline metric.
        # Four configurations (decorative BDD, fully redundant BDD, uniquely valuable BDD,
        # BDD-only) plus the degenerate cases must hold, or the paper's headline number is
        # meaningless no matter how well it builds.
        run: python -m unittest discover -s tests -v

  guard:
    name: Confidentiality firewall
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run guard-secrets
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          ./tools/guard-secrets.ps1
